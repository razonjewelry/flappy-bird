<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <title>המשימות שלנו</title>

    <!-- viewport-fit=cover נדרש כדי שהאפליקציה תמלא את המסך באייפונים עם מגרעת -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="description" content="רשימת משימות משותפת לאור וזיו" />
    <meta name="theme-color" content="#121212" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />

    <!-- iOS מתעלם מ-manifest.json ודורש את התגיות האלה כדי שהוספה
         למסך הבית תיתן אייקון ותיפתח במסך מלא ללא סרגל הדפדפן -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="המשימות" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #121212;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
